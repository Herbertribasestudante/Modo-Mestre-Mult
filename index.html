<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#070b14" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>ModoMestre 2 — Régua Geométrica dos Modos Gregos</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/svg+xml" href="./icon.svg" />
<link rel="apple-touch-icon" href="./icon.svg" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background-color:#070b14;color:#f1f5f9;min-height:100vh;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
input[type="range"]{-webkit-appearance:none;appearance:none;height:5px;background:#1e293b;border-radius:999px;outline:none;cursor:pointer}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#38bdf8;cursor:pointer;box-shadow:0 0 8px rgba(56,189,248,.6)}
input[type="range"].amber-thumb::-webkit-slider-thumb{background:#f59e0b;box-shadow:0 0 8px rgba(245,158,11,.6)}
input[type="range"].emerald-thumb::-webkit-slider-thumb{background:#10b981;box-shadow:0 0 8px rgba(16,185,129,.6)}
.fretboard-wood{background:linear-gradient(180deg,#2b1d14 0%,#1f140d 50%,#281a11 100%);box-shadow:inset 0 2px 12px rgba(0,0,0,.75)}
.note-dot{transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
.note-dot:hover{transform:scale(1.16);filter:brightness(1.12)}
.note-dot.active-pulse{transform:scale(1.26)!important;box-shadow:0 0 16px #fff,0 0 26px #38bdf8!important;z-index:30}
.fret-scroll{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-x:contain}
.note-dot{touch-action:none;-webkit-user-select:none;user-select:none}
.note-dot.sel-dot{transform:scale(1.28)!important;outline:3px solid #fff;outline-offset:1px;box-shadow:0 0 18px #fff,0 0 30px rgba(255,255,255,.55)!important;z-index:40}
.fret-scroll::-webkit-scrollbar{height:6px}
.fret-scroll::-webkit-scrollbar-track{background:#0b1120;border-radius:999px}
.fret-scroll::-webkit-scrollbar-thumb{background:#1e293b;border-radius:999px}
</style>
</head>
<body class="p-3 sm:p-5">
<div class="max-w-5xl mx-auto flex flex-col gap-3.5">
 
<header class="bg-[#0d1424] border border-slate-800/90 rounded-2xl p-4 sm:p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-xl">
<div class="flex flex-col gap-1">
<div class="flex flex-wrap items-center gap-2.5">
<span class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_10px_#fbbf24]"></span>
<h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-white">ModoMestre</h1>
<span id="uiHeaderBadge" class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-slate-800/90 text-slate-300 border border-slate-700/70">Régua Geométrica</span>
<div class="inline-flex items-center bg-[#080d18] border border-slate-800 rounded-lg p-0.5 ml-1" role="group" aria-label="Language">
<button type="button" data-lang="pt" class="lang-btn px-2 py-0.5 text-[11px] font-bold rounded-md transition">PT-BR</button>
<button type="button" data-lang="en" class="lang-btn px-2 py-0.5 text-[11px] font-bold rounded-md transition">EN</button>
<button type="button" data-lang="es" class="lang-btn px-2 py-0.5 text-[11px] font-bold rounded-md transition">ES</button>
</div>
</div>
<p id="uiHeaderSubtitle" class="text-xs sm:text-[13px] text-slate-400 max-w-xl leading-relaxed"></p>
</div>
<div class="flex flex-wrap items-center gap-2 shrink-0">
<button id="btnPedalBase" type="button" class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-[0_0_18px_rgba(245,158,11,0.35)] transition cursor-pointer"><span id="pedalPlayIcon">▶</span><span id="uiBtnPedal">Tocar Pedal + Base</span></button>
<button id="btnPlayScale" type="button" class="flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl font-semibold text-xs sm:text-sm bg-[#131d33] hover:bg-[#1a2744] text-slate-200 border border-slate-700/80 transition cursor-pointer"><span>♫</span><span id="uiBtnScale">Ouvir Escala</span></button>
<button id="btnPlaySlow" type="button" class="flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl font-semibold text-xs sm:text-sm bg-[#131d33] hover:bg-[#1a2744] text-slate-300 border border-slate-700/80 transition cursor-pointer"><span>◷</span><span id="uiBtnSlow">Ouvir Lento</span></button>
<button id="btnPlayHarmony" type="button" class="flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl font-semibold text-xs sm:text-sm bg-[#131d33] hover:bg-[#1a2744] text-sky-300 border border-sky-500/40 transition cursor-pointer"><span>♪</span><span id="uiBtnHarmony">Ouvir Harmonia</span></button>
</div>
</header>
 
<section class="bg-[#0d1424] border border-slate-800/90 rounded-2xl p-3.5 sm:p-4 flex flex-col gap-3 shadow-lg">
<div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-800/80">
<div class="flex items-center gap-3">
<button id="btnMetronome" type="button" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold bg-[#131d33] hover:bg-[#1b2947] text-slate-200 border border-slate-700/80 transition cursor-pointer"><span id="metroDot" class="w-2 h-2 rounded-full bg-slate-500"></span><span id="uiBtnMetro">Metrônomo</span></button>
<div id="beatLeds" class="flex items-center gap-1.5">
<span class="beat-led w-2 h-2 rounded-full bg-slate-700 transition-all"></span><span class="beat-led w-2 h-2 rounded-full bg-slate-700 transition-all"></span><span class="beat-led w-2 h-2 rounded-full bg-slate-700 transition-all"></span><span class="beat-led w-2 h-2 rounded-full bg-slate-700 transition-all"></span>
</div>
</div>
<div class="flex items-center gap-2">
<button id="btnBpmDown" type="button" class="w-7 h-7 rounded-lg bg-[#131d33] hover:bg-slate-700 text-slate-200 font-bold text-sm border border-slate-700/80 flex items-center justify-center cursor-pointer">−</button>
<div class="px-2.5 py-1 rounded-lg bg-[#080d18] border border-slate-800 text-xs font-bold text-slate-100 min-w-[74px] text-center"><span id="bpmValue">96</span> <span class="text-slate-400 font-semibold">BPM</span></div>
<button id="btnBpmUp" type="button" class="w-7 h-7 rounded-lg bg-[#131d33] hover:bg-slate-700 text-slate-200 font-bold text-sm border border-slate-700/80 flex items-center justify-center cursor-pointer">+</button>
<select id="timeSigSelect" class="ml-1 bg-[#131d33] text-slate-200 text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-slate-700/80 outline-none cursor-pointer"><option value="4" selected>4/4</option><option value="3">3/4</option><option value="6">6/8</option></select>
</div>
<div class="flex items-center gap-2.5 min-w-[200px] flex-1 sm:flex-initial justify-end">
<span id="uiVolMetroLabel" class="text-[10px] font-bold uppercase tracking-wider text-slate-400">VOL. METRÔNOMO</span>
<input id="sliderMetroVol" type="range" min="0" max="100" value="45" class="w-24 sm:w-28" />
<span id="valMetroVol" class="text-xs font-semibold text-slate-300 w-8 text-right">45%</span>
</div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-x-6 items-center">
<div class="flex items-center gap-2.5"><span class="w-2 h-2 rounded-full bg-amber-400 shrink-0"></span><span id="uiVolBaseLabel" class="text-xs font-semibold text-slate-300 shrink-0">Vol. Base (Pedal)</span><input id="sliderBaseVol" type="range" min="0" max="100" value="78" class="amber-thumb flex-1" /><span id="valBaseVol" class="text-xs font-bold text-slate-200 w-9 text-right">78%</span></div>
<div class="flex items-center gap-2.5"><span class="w-2 h-2 rounded-full bg-sky-400 shrink-0"></span><span id="uiVolScaleLabel" class="text-xs font-semibold text-slate-300 shrink-0">Vol. Escala / Notas</span><input id="sliderScaleVol" type="range" min="0" max="100" value="88" class="flex-1" /><span id="valScaleVol" class="text-xs font-bold text-slate-200 w-9 text-right">88%</span></div>
<div class="flex items-center gap-2.5 sm:col-span-2"><span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span><span id="uiVolMasterLabel" class="text-xs font-semibold text-slate-300 shrink-0">Volume Geral (Boost)</span><input id="sliderMasterVol" type="range" min="0" max="150" value="100" class="emerald-thumb flex-1" /><span id="valMasterVol" class="text-xs font-bold text-slate-200 w-10 text-right">100%</span></div>
<div class="flex flex-wrap items-center gap-2 sm:col-span-2 pt-2 border-t border-slate-800/80">
<span id="uiPresetLabel" class="text-[10px] font-bold uppercase tracking-wider text-slate-400">MIXAGEM</span>
<button id="btnPresetStudy" type="button"></button>
<button id="btnPresetBacking" type="button"></button>
<button id="btnKeepAwake" type="button" class="ml-auto"></button>
</div>
</div>
</section>
 
<div class="grid grid-cols-1 lg:grid-cols-12 gap-3.5">
<section class="lg:col-span-5 bg-[#0d1424] border border-slate-800/90 rounded-2xl p-4 flex flex-col justify-between gap-3.5 shadow-lg">
<div class="flex items-center justify-between gap-2">
<h2 id="uiStep1Title" class="text-[11px] font-extrabold uppercase tracking-wider text-slate-300">1. ESCOLHA O CHEFE (PEDAL POINT)</h2>
<div class="inline-flex bg-[#080d18] p-0.5 rounded-lg border border-slate-800">
<button id="btnString6" type="button" class="px-2.5 py-1 rounded-md text-[11px] font-bold transition cursor-pointer">6ª Corda (E)</button>
<button id="btnString5" type="button" class="px-2.5 py-1 rounded-md text-[11px] font-bold transition cursor-pointer">5ª Corda (A)</button>
<button id="btnString7" type="button" class="hidden px-2.5 py-1 rounded-md text-[11px] font-bold transition cursor-pointer">7ª Corda (B)</button>
</div>
</div>
<div id="bossGrid" class="grid grid-cols-6 gap-2"></div>
</section>
<section class="lg:col-span-7 bg-[#0d1424] border border-slate-800/90 rounded-2xl p-4 flex flex-col gap-3 shadow-lg">
<div class="flex items-center justify-between">
<h2 id="uiStep2Title" class="text-[11px] font-extrabold uppercase tracking-wider text-slate-300">2. ESCOLHA O MODO GREGO</h2>
<span id="uiFixedRulerBadge" class="text-[11px] font-semibold text-slate-400">Régua Fixa</span>
</div>
<div id="modesGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5"></div>
</section>
</div>
 
<section class="bg-[#0d1424] border border-slate-800/90 rounded-2xl p-4 sm:p-5 flex flex-col gap-3.5 shadow-lg">
<div class="flex flex-wrap items-start justify-between gap-2">
<div>
<div id="uiStep3Label" class="text-[11px] font-extrabold uppercase tracking-wider text-amber-400 mb-1">3. RÉGUA GEOMÉTRICA NA MÃO (SEM CONTA)</div>
<h2 id="rulerHeadline" class="text-lg sm:text-xl font-extrabold text-white tracking-tight"></h2>
</div>
<span id="genreBadge" class="px-3 py-1 rounded-full text-xs font-bold bg-amber-500/15 text-amber-300 border border-amber-500/35"></span>
</div>
<p id="rulerPracticalText" class="text-xs sm:text-sm text-slate-300 leading-relaxed"></p>
<div class="grid grid-cols-1 md:grid-cols-3 gap-2.5">
<div class="bg-[#080d18] border border-slate-800/90 rounded-xl p-3"><div id="uiBox1Title" class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-400 mb-1"></div><div id="box1Body" class="text-xs sm:text-[13px] font-bold text-slate-100"></div></div>
<div class="bg-[#080d18] border border-slate-800/90 rounded-xl p-3"><div id="uiBox2Title" class="text-[10px] font-extrabold uppercase tracking-wider text-amber-400 mb-1"></div><div id="box2Body" class="text-xs sm:text-[13px] font-bold text-slate-100"></div></div>
<div class="bg-[#080d18] border border-slate-800/90 rounded-xl p-3"><div id="uiBox3Title" class="text-[10px] font-extrabold uppercase tracking-wider text-sky-400 mb-1"></div><div id="box3Body" class="text-xs sm:text-[13px] font-bold text-slate-100"></div></div>
</div>
<div class="bg-[#080d18] border border-slate-800/90 rounded-xl px-3.5 py-2.5 flex flex-wrap items-center justify-between gap-2 text-xs">
<span id="parentShapeBadge" class="font-bold text-sky-400"></span>
<span id="parentShapeHint" class="text-slate-400"></span>
</div>
</section>
 
<section class="bg-[#0d1424] border border-slate-800/90 rounded-2xl p-4
